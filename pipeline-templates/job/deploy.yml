parameters:
  ServiceConnection:
  SolutionBaseName:
  Environment:
  AppRoleAssignmentsServiceConnection:

jobs:
- deployment: DeployFunctionApp
  pool:
    name: DAS - Continuous Deployment Agents
  environment: ${{ parameters.Environment }}
  strategy:
    runOnce:
      deploy:
        steps:
        - task: PowerShell@2
          displayName: Validate Employer Finance Jobs Outer API configuration
          inputs:
            targetType: inline
            pwsh: true
            script: |
              $requiredVariables = @('EmployerFinanceJobsApimUrl', 'EmployerFinanceJobsApimSubscriptionKey')
              $missingVariables = $requiredVariables | Where-Object {
                $value = [Environment]::GetEnvironmentVariable($_)
                [string]::IsNullOrWhiteSpace($value) -or $value -match '\$\([^)]+\)'
              }
              if ($missingVariables) {
                throw "Missing or unresolved required pipeline variables: $($missingVariables -join ', '). Set them in a variable group used by this deployment."
              }

              $outerApiUri = $null
              if (-not [Uri]::TryCreate($env:EmployerFinanceJobsApimUrl, [UriKind]::Absolute, [ref]$outerApiUri) -or
                  $outerApiUri.Scheme -notin @('http', 'https')) {
                throw 'EmployerFinanceJobsApimUrl must be an absolute HTTP or HTTPS URL.'
              }
          env:
            EmployerFinanceJobsApimUrl: $(EmployerFinanceJobsApimUrl)
            EmployerFinanceJobsApimSubscriptionKey: $(EmployerFinanceJobsApimSubscriptionKey)
        - template: azure-pipelines-templates/deploy/step/wait-azure-devops-deployment.yml@das-platform-building-blocks
          parameters:
            ServiceConnection: ${{ parameters.ServiceConnection }}
            EnvironmentId: $(Environment.Id)
            PipelineName: $(Build.DefinitionName)
            RunId: $(Build.BuildId)
        - template: azure-pipelines-templates/deploy/step/arm-deploy.yml@das-platform-building-blocks
          parameters:
            ServiceConnection: ${{ parameters.ServiceConnection }}
            SubscriptionId: $(SubscriptionId)
            Location: $(ResourceGroupLocation)
            Environment: ${{ parameters.Environment }}
            TemplatePath: $(Pipeline.Workspace)/${{ parameters.SolutionBaseName }}/azure/template.json
            ParametersPath: $(Pipeline.Workspace)/${{ parameters.SolutionBaseName }}/azure/template.parameters.json
            IsMultiRepoCheckout: true
            TemplateSecrets:
              LoggingRedisConnectionString: $(LoggingRedisConnectionString)
              ConfigurationStorageConnectionString: $(ConfigurationStorageConnectionString)
              SharedStorageAccountConnectionString: $(SharedStorageAccountConnectionString)
        - template: azure-pipelines-templates/deploy/step/generate-config.yml@das-platform-building-blocks
          parameters:
            EnvironmentName: $(EnvironmentName)
            ServiceConnection: ${{ parameters.ServiceConnection }}
            SourcePath: $(Pipeline.Workspace)/das-employer-config/Configuration/das-employer-finance-jobs
            StorageAccountName: $(ConfigurationStorageAccountName)
            StorageAccountResourceGroup: $(SharedEnvResourceGroup)
            TargetFileName: '*.schema.json'
            TableName: Configuration
            Version: '2.0'
            ConfigurationSecrets:
              HmrcClientSecret: $(HmrcClientSecret)
              EmployerFinanceJobsApimUrl: $(EmployerFinanceJobsApimUrl)
              EmployerFinanceJobsApimSubscriptionKey: $(EmployerFinanceJobsApimSubscriptionKey)
        - template: azure-pipelines-templates/deploy/step/app-role-assignments.yml@das-platform-building-blocks
          parameters:
            ServiceConnection: ${{ parameters.AppRoleAssignmentsServiceConnection }}
            ResourceName: $(ImportPaymentsFunctionAppName)
            Tenant: $(Tenant)
            IsMultiRepoCheckout: true
        - template: azure-pipelines-templates/deploy/step/function-deploy.yml@das-platform-building-blocks
          parameters:
            ServiceConnection: ${{ parameters.ServiceConnection }}
            FunctionAppName: $(ImportPaymentsFunctionAppName)
            DeploymentPackagePath: $(Pipeline.Workspace)/${{ parameters.SolutionBaseName }}/SFA.DAS.Employer.Finance.Jobs.Functions/${{ parameters.SolutionBaseName }}.Functions.zip
        - template: azure-pipelines-templates/deploy/step/app-role-assignments.yml@das-platform-building-blocks
          parameters:
            ServiceConnection: ${{ parameters.AppRoleAssignmentsServiceConnection }}
            ResourceName: $(ImportLevyFunctionAppName)
            Tenant: $(Tenant)
            IsMultiRepoCheckout: true
        - template: azure-pipelines-templates/deploy/step/function-deploy.yml@das-platform-building-blocks
          parameters:
            ServiceConnection: ${{ parameters.ServiceConnection }}
            FunctionAppName: $(ImportLevyFunctionAppName)
            DeploymentPackagePath: $(Pipeline.Workspace)/${{ parameters.SolutionBaseName }}/SFA.DAS.Employer.Finance.Jobs.Functions.ImportLevy/SFA.DAS.Employer.Finance.Jobs.Functions.ImportLevy.zip
        - template: azure-pipelines-templates/deploy/step/app-role-assignments.yml@das-platform-building-blocks
          parameters:
            ServiceConnection: ${{ parameters.AppRoleAssignmentsServiceConnection }}
            ResourceName: $(ExpireFundsFunctionAppName)
            Tenant: $(Tenant)
            IsMultiRepoCheckout: true
        - template: azure-pipelines-templates/deploy/step/function-deploy.yml@das-platform-building-blocks
          parameters:
            ServiceConnection: ${{ parameters.ServiceConnection }}
            FunctionAppName: $(ExpireFundsFunctionAppName)
            DeploymentPackagePath: $(Pipeline.Workspace)/${{ parameters.SolutionBaseName }}/SFA.DAS.Employer.Finance.Jobs.Functions.ExpireFunds/SFA.DAS.Employer.Finance.Jobs.Functions.ExpireFunds.zip
