parameters:
  SolutionBaseName:
  BuildConfiguration:

jobs:
- job: CodeBuild
  pool:
    name: DAS - Continuous Integration Agents
  variables:
  - name: BuildConfiguration
    value: release
  - group: BUILD Management Resources
  workspace:
      clean: all
  steps:
  - template: azure-pipelines-templates/build/step/gitversion.yml@das-platform-building-blocks
  - template: azure-pipelines-templates/build/step/app-build.yml@das-platform-building-blocks
    parameters:
      ContinueOnVulnerablePackageScanError: true

  - task: DotNetCoreCLI@2
    displayName: 'Publish - dotnet publish Function App Functions'
    inputs:
      command: publish
      publishWebProjects: false
      projects: src/${{ parameters.SolutionBaseName }}.Functions/${{ parameters.SolutionBaseName }}.Functions.csproj
      arguments: '--configuration $(buildConfiguration) --output $(build.artifactstagingdirectory)/publish --no-restore --no-build'

  - task: DotNetCoreCLI@2
    displayName: 'Publish - dotnet publish Function App ProcessAccountPayments'
    inputs:
      command: publish
      publishWebProjects: false
      projects: src/${{ parameters.SolutionBaseName }}.Functions.ProcessAccountPayments/${{ parameters.SolutionBaseName }}.Functions.ProcessAccountPayments.csproj
      arguments: '--configuration $(buildConfiguration) --output $(build.artifactstagingdirectory)/publishProcessAccountPayments --no-restore --no-build'

  - task: ArchiveFiles@2
    displayName: 'Archive Functions publish to zip'
    inputs:
      rootFolderOrFile: '$(build.artifactstagingdirectory)/publish'
      includeRootFolder: false
      archiveType: zip
      archiveFile: '$(build.artifactstagingdirectory)/publish/${{ parameters.SolutionBaseName }}.Functions.zip'
      replaceExistingArchive: true

  - task: ArchiveFiles@2
    displayName: 'Archive ProcessAccountPayments publish to zip'
    inputs:
      rootFolderOrFile: '$(build.artifactstagingdirectory)/publishProcessAccountPayments'
      includeRootFolder: false
      archiveType: zip
      archiveFile: '$(build.artifactstagingdirectory)/publish/${{ parameters.SolutionBaseName }}.Functions.ProcessAccountPayments.zip'
      replaceExistingArchive: true

  - task: CopyFiles@2
    displayName: 'Copy Files to: $(build.artifactstagingdirectory)'
    inputs:
      Contents: |
        azure/**
      TargetFolder: '$(build.artifactstagingdirectory)/publish'
      OverWrite: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact'
    inputs:
      PathtoPublish: '$(build.artifactstagingdirectory)/publish'
      artifactName: ${{ parameters.SolutionBaseName }}
